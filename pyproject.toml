[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eagleeye2"
version = "0.1.0"
description = "Find a person's social profiles from a face photo — modern EagleEye successor (deepface + profile discovery)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Stefan Yasin" }]
keywords = ["osint", "face-recognition", "deepface", "recon", "social-media"]
dependencies = [
    "deepface>=0.0.100",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
eagleeye2 = "eagleeye2.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eagleeye2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
