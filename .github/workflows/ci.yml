# Fast CI: syntax check + unit tests + CLI smoke test.
# Light deps only: deepface (TensorFlow/torch) is lazy-imported and not
# needed by the unit tests, so it is intentionally not installed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest httpx beautifulsoup4 typer rich

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: CLI import smoke test
        run: python -c "import eagleeye2.cli"
